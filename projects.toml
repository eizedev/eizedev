notes = ["HACS custom repository"]
versions = [{ label = "Release", badge = "github/v/release/eizedev/ha-managed-switch" }]
library = { name = "aiosnmpswitch", url = "https://aiosnmpswitch.eize.dev/", badge = "pypi/v/aiosnmpswitch" }

