# The one place that lists my projects. site/build.py turns it into the page on eize.dev and into
# the projects part of README.md (between the "projects" markers). Change this file, then run
# `uv run site/build.py --readme` and commit both; CI fails when README.md is out of date.
#
# Versions and stars are not written here: the page reads them from shields.io when it is built
# (weekly and on every push), the README shows them as live badges. A `badge` is a shields.io path
# without the host, e.g. "pypi/v/aiosynologysrm".
#
# Icons: `icon` is a path in eizedev/brand (an SVG), `glyph` two letters for projects without one.

[site]
url = "https://eize.dev"
title = "eizedev"
description = "Open-source tools by René (eizedev): pivotkit, Home Assistant integrations, Synology packages and PowerShell Universal components."
brand = "https://raw.githubusercontent.com/eizedev/brand/main"
github = "https://github.com/eizedev"
sponsor = "https://github.com/sponsors/eizedev"
author = "René"
# The one public contact address, a forward (as in the other projects); security reports go through
# GitHub's private reporting of each repository.
contact = "oss@eize.dev"
social_alt = "The eizedev logo: a green prompt chevron, a blue e and a yellow cursor"

[intro]
prompt = "~/eizedev"
headline = "Tools I wanted to exist, built so others can use them too."
text = "I'm René. I build open-source tools for reports, Home Assistant, Synology and PowerShell: typed, read-only where it matters, documented end to end and tested on real hardware."

[flagship]
name = "pivotkit"
repo = "eizedev/pivotkit"
icon = "pivotkit/out/icon.svg"
kicker = "Open source · MIT"
docs = "https://pivotkit.eize.dev/"
# Docs sites with an llms.txt get it linked from eize.dev/llms.txt, so agents find the full docs.
llms = "https://pivotkit.eize.dev/llms.txt"
lead = "Excel's PivotTable for web apps and the command line. People load their data, build the report by dragging fields and take it to Excel. The same report renders again in CI, behind a REST service or for an AI client."
install = "npm install pivotkit-react"
badge = "npm/v/pivotkit-react"
packages = ["pivotkit-core", "pivotkit-react", "pivotkit-element", "pivotkit-xlsx", "pivotkit-report", "pivotkit-cli", "pivotkit-server", "pivotkit-mcp"]
packages_label = "Eight packages on npm, each usable on its own:"

[[flagship.points]]
title = "Bring your own file."
text = "CSV, JSON or Excel dropped onto the report, with a preview and a type per column. Nothing is uploaded."

[[flagship.points]]
title = "Excel with the layout kept,"
text = "plus the rows behind every number as CSV or JSON."

[[flagship.points]]
title = "Views are safe JSON"
text = "with a published schema. A view cannot run code, and the CLI checks it in CI."

[[flagship.points]]
title = "One report, many places:"
text = "React, a web component, Node, a command line, a REST service with a container image, and an MCP server that never hands the model the rows."

[[flagship.links]]
label = "Try the live demo"
url = "https://pivotkit.eize.dev/playground/"
primary = true

[[flagship.links]]
label = "Documentation"
url = "https://pivotkit.eize.dev/"

[[flagship.links]]
label = "Compared with others"
url = "https://pivotkit.eize.dev/compare/"

[flagship.screenshot]
# Taken from the pivotkit repository when the page is built, so it stays current.
light = "https://raw.githubusercontent.com/eizedev/pivotkit/main/docs/assets/screenshots/report-light.png"
dark = "https://raw.githubusercontent.com/eizedev/pivotkit/main/docs/assets/screenshots/report-dark.png"
alt = "pivotkit report: average temperature of 14 cities by month as a colour scale"
caption = "The live demo with weather data from Open-Meteo.com (CC BY 4.0)."

[[groups]]
title = "PowerShell Universal"
colour = "blue"
text = "Components for PowerShell Universal apps, fed straight from SQL, REST and PowerShell objects. The pivot module is pivotkit inside PSU."

[[groups.projects]]
name = "powershell-universal-components"
repo = "eizedev/powershell-universal-components"
icon = "powershell-universal-components/out/icon.svg"
docs = "https://powershell-universal-components.eize.dev/"
llms = "https://powershell-universal-components.eize.dev/llms.txt"
text = "Apache ECharts with 29 chart types, a Perspective datagrid with pivot and WebGL charts, and the pivotkit report builder, each one a module of its own."
notes = ["PowerShell Gallery"]
versions = [
  { label = "ECharts", badge = "powershellgallery/v/PowerShellUniversal.Component.ECharts" },
  { label = "Perspective", badge = "powershellgallery/v/PowerShellUniversal.Component.Perspective" },
  { label = "Pivot", badge = "powershellgallery/v/PowerShellUniversal.Component.Pivot" },
]

[[groups]]
title = "Home Assistant and the home network"
colour = "green"
text = "Integrations for the network gear in many homes, each on its own typed Python library that other projects can use too. Read-only and vendor-neutral where the standards allow it."

[[groups.projects]]
name = "Synology SRM Router"
